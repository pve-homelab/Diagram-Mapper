# Local development database only. Credentials here are fixed, local, throwaway values.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: diagram_mapper
      POSTGRES_PASSWORD: diagram_mapper
      POSTGRES_DB: diagram_mapper
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diagram_mapper"]
      interval: 2s
      timeout: 3s
      retries: 15
